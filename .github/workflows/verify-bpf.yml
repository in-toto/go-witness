name: Verify BPF
on:
  workflow_dispatch:
  push:
    branches: ["main", "release-*"]
  pull_request:
permissions:
  contents: read

jobs:
  # Rebuild the committed BPF objects with the pinned toolchain and fail if they differ.
  verify-bpf:
    name: Verify generated BPF objects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Regenerate BPF objects and Go bindings
        run: |
          make generate-bpf
          if ! git diff --exit-code; then
            echo "Generated BPF objects are not up to date with their sources, run 'make generate-bpf'" >&2
            exit 1
          fi
